# The suite's verdict used to depend on whether the local tree happened to
# have dist/ built (#46). Running it from a clean clone is what stops the
# answer being a local one.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` runs `prepare`, which builds. Kept explicit anyway so a
      # failure here reads as "the build broke", not "a test failed".
      - run: npm ci
      - run: npm run build

      # 🛑 `tsconfig.test.json`, NOT the build config. `tsc --noEmit` reads
      # `include: ['src/**/*']`, so for months a test could import a symbol
      # that does not exist and both agents quoted "tsc clean" on the PR.
      # `npm run build` above already proves the build config compiles, so
      # this replaces the src-only run rather than sitting beside it.
      - run: npm run typecheck

      # Prettier's own defaults, with no config overriding them. A
      # formatting failure here reads as formatting, not as a test.
      - run: npm run format:check

      - run: npm test
